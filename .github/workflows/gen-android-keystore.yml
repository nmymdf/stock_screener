name: 產生 Android 簽章金鑰（只需要跑一次）

# 手動觸發，在 GitHub 的伺服器上產生一把固定的簽章金鑰，讓 App 之後每次更新都
# 能蓋掉舊版安裝、保留資料（見 README「Android 更新保留資料」）。
#
# 金鑰只在這台暫時的雲端機器上產生，從頭到尾不會出現在任何人的電腦、聊天記錄
# 或 repo 裡——產生好之後打包成一個「執行紀錄的附加檔案（Artifact）」讓你下載，
# 下載、設定完 Secrets 之後，記得回來刪掉這次執行紀錄（見下面的產出說明）。
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 產生金鑰
        run: |
          set -e
          STORE_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore release.keystore.jks \
            -alias stockscreener \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=StockScreener, OU=StockScreener, O=StockScreener, L=Taipei, S=Taipei, C=TW"
          base64 -w0 release.keystore.jks > release.keystore.jks.base64
          {
            echo "把下面 4 行分別新增成 repo 的 4 個 Secrets："
            echo "（Settings → Secrets and variables → Actions → New repository secret）"
            echo ""
            echo "名稱：ANDROID_KEYSTORE_BASE64"
            echo "值：release.keystore.jks.base64 這個檔案的完整內容（開啟後全選複製）"
            echo ""
            echo "名稱：ANDROID_KEYSTORE_PASSWORD"
            echo "值：$STORE_PASS"
            echo ""
            echo "名稱：ANDROID_KEY_ALIAS"
            echo "值：stockscreener"
            echo ""
            echo "名稱：ANDROID_KEY_PASSWORD"
            echo "值：$STORE_PASS"
            echo ""
            echo "設定完 4 個 Secrets 之後："
            echo "1. 回到 Actions，把這次「產生 Android 簽章金鑰」的執行紀錄刪除（右上角 ··· → Delete workflow run）"
            echo "2. 刪掉你電腦上下載的這個壓縮檔"
            echo "3. 重新觸發一次「編譯 Windows / Android」，之後編出來的 apk 就能保留資料更新了"
          } > 設定步驟.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-keystore-請下載後盡快刪除此執行紀錄
          path: |
            release.keystore.jks.base64
            設定步驟.txt
          retention-days: 1
